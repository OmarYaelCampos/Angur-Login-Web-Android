<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183f40">
  <title>Iniciar sesión | Angur Gestión</title>
  <link rel="stylesheet" href="assets/login.css">
  <script defer src="assets/login.js"></script>
</head>
<body>
  <main class="login-layout">
    <section class="login-card" aria-labelledby="form-title">
      <div class="brand"><strong>Angur</strong><span>Gestión</span></div>
      <div id="form-view">
        <h2 id="form-title">Bienvenido de nuevo.</h2>
        <p class="subtitle">Ingresa tus credenciales para continuar.</p>
        <form id="login-form" data-endpoint="api/auth/login" novalidate>
          <div class="field">
            <label for="identifier">Usuario o correo electrónico</label>
            <input id="identifier" name="identifier" type="text" autocomplete="username" maxlength="254" required
                   placeholder="Ingresa tu usuario o correo" aria-describedby="identifier-error">
            <small id="identifier-error" class="field-error" aria-live="polite"></small>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required
                   placeholder="Ingresa tu contraseña" aria-describedby="password-error">
            <small id="password-error" class="field-error" aria-live="polite"></small>
          </div>
          <p id="form-message" class="form-message" role="alert" hidden></p>
          <button id="submit-button" type="submit">Iniciar sesión</button>
        </form>
      </div>
      <div id="success-view" class="success-view" role="status" hidden>
        <div class="success-icon" aria-hidden="true">✓</div>
        <h2>Inicio de sesión correcto</h2>
        <p id="success-name"></p>
        <p id="success-role" class="role-badge"></p>
      </div>
    </section>
  </main>
</body>
</html>
